<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Lista de Compras</h1>
        <div class="card">
            <div class="card-body">
                <h2>Listado de Productos</h2>
                
                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>
                <form id="form-producto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" aria-label="Nombre del Producto">
                        <button class="btn btn-primary" type="submit" id="add">Agregar Producto</button>
                    </div>
                    <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                        <button type="button" class="btn btn-danger" id="clean">Limpiar tabla</button>
                        <button type="button" class="btn btn-warning" id="orden">Ordenar tabla</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía el formulario con el nombre del producto para agregar.
         */
        const listaProductos = document.getElementById('lista-productos');
        const formulario = document.querySelector('form');


        function guardarEnLocalStorage() {
            const productos = [];
            document.querySelectorAll('#lista-productos li').forEach(li => {
                const textoSpan = li.querySelector('.nombre-producto');
                if (textoSpan) {
                    productos.push({
                        nombre: textoSpan.textContent,
                        comprado: textoSpan.classList.contains('text-decoration-line-through')
                    });
                }
            });
            localStorage.setItem('listaProductos', JSON.stringify(productos));
        }

        function cargarDesdeLocalStorage() {
            listaProductos.innerHTML = ""; 
            const productosGuardados = JSON.parse(localStorage.getItem('listaProductos')) || [];
            
            if (productosGuardados.length === 0) {
                agregarProducto("Pan", false);
            } else {
                productosGuardados.forEach(prod => agregarProducto(prod.nombre, prod.comprado));
            }
        }


        function agregarProducto(nombreProducto, comprado = false) {
            if (!nombreProducto.trim()) return;

            const li = document.createElement('li');
            li.classList.add('mb-2', 'd-flex', 'align-items-center', 'gap-2');

            const spanTexto = document.createElement('span');
            spanTexto.textContent = nombreProducto;
            spanTexto.classList.add('nombre-producto', 'me-auto');
            spanTexto.style.cursor = 'pointer';

            if (comprado) {
                spanTexto.classList.add('text-decoration-line-through', 'text-muted');
            }

            spanTexto.addEventListener('click', function() {
                spanTexto.classList.toggle('text-decoration-line-through');
                spanTexto.classList.toggle('text-muted');
                guardarEnLocalStorage();
            });

            const botonEditar = document.createElement('button');
            botonEditar.textContent = "Editar";
            botonEditar.classList.add('btn', 'btn-warning', 'btn-sm');
            botonEditar.type = "button";

            botonEditar.addEventListener('click', function() {
                const nuevoNombre = prompt("Editar producto:", spanTexto.textContent);
                if (nuevoNombre !== null && nuevoNombre.trim() !== "") {
                    spanTexto.textContent = nuevoNombre.trim();
                    guardarEnLocalStorage();
                }
            });

            const botonEliminar = document.createElement('button');
            botonEliminar.textContent = "Eliminar";
            botonEliminar.classList.add('btn', 'btn-danger', 'btn-sm');
            botonEliminar.type = "button";

            botonEliminar.addEventListener('click', function() {
                li.remove();
                guardarEnLocalStorage();
            });

            li.appendChild(spanTexto);
            li.appendChild(botonEditar);
            li.appendChild(botonEliminar);
            listaProductos.appendChild(li);

            guardarEnLocalStorage();
        }


        function handlerFormulario(evento) {
            evento.preventDefault();
            const input = evento.target.querySelector('input');
            const nombreProducto = input.value;
            
            if (nombreProducto.trim() !== "") {
                agregarProducto(nombreProducto);
                input.value = "";
            }
        }

        function eliminarProductos() {
            listaProductos.innerHTML = "";
            guardarEnLocalStorage();
        }

        function ordenarElementos() {
            const elementos = Array.from(listaProductos.children);
            elementos.sort((a, b) => {
                const textoA = a.querySelector('.nombre-producto').textContent;
                const textoB = b.querySelector('.nombre-producto').textContent;
                return textoA.localeCompare(textoB);
            });
            
            listaProductos.innerHTML = "";
            elementos.forEach(elemento => listaProductos.appendChild(elemento));
            guardarEnLocalStorage();
        }

        formulario.addEventListener('submit', handlerFormulario);
        document.getElementById('clean').addEventListener('click', eliminarProductos);
        document.getElementById('orden').addEventListener('click', ordenarElementos);

        document.addEventListener('DOMContentLoaded', cargarDesdeLocalStorage);
    </script>
</body>
</html>
