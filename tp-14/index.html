<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <div class="container my-4">
        <h1>Lista de Contactos</h1>
        
        <div class="card">
            <div class="card-body">
                <h2>Contactos</h2>

                <div class="row mb-3 g-2">
                    <div class="col-md-4">
                        <input type="text" id="input-buscar" class="form-control" placeholder="🔍 Buscar por nombre, apellido o teléfono...">
                    </div>
                    <div class="col-md-8 d-flex gap-2 flex-wrap">
                        <button class="btn btn-outline-secondary btn-sm" id="btn-ordenar">Ordenar: Nombre</button>
                        <button class="btn btn-outline-warning btn-sm" id="btn-favoritos">Ver Todos</button>
                        <button class="btn btn-danger btn-sm" id="btn-eliminar-varios">Eliminar Seleccionados</button>
                    </div>
                </div>

                <ul id="lista-contactos" class="list-group mb-3"></ul>

                <hr class="hr">
                
                <h2>Nuevo Contacto</h2>
                <form id="form-contacto">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="input-nombre" placeholder="Nombre" required>
                        <input type="text" class="form-control" id="input-apellido" placeholder="Apellido" required>
                        <input type="text" class="form-control" id="input-telefono" placeholder="Teléfono" required>
                    </div>
                    <button class="btn btn-primary" type="submit" id="btn-guardar">Agregar Contacto</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script type="text/javascript">
        let contactos = [
            { id: 1, nombre: 'Juan', apellido: 'Perez', telefono: '1122334455', favorito: false },
            { id: 2, nombre: 'Ana', apellido: 'Gomez', telefono: '9988776655', favorito: true }
        ];

        let criterioOrden = 'nombre'; // 'nombre' o 'apellido'
        let soloFavoritos = false;   
        let editandoId = null;       

        const listaContactosEl = document.getElementById('lista-contactos');
        const formEl = document.getElementById('form-contacto');
        const inputNombre = document.getElementById('input-nombre');
        const inputApellido = document.getElementById('input-apellido');
        const inputTelefono = document.getElementById('input-telefono');
        const inputBuscar = document.getElementById('input-buscar');
        const btnOrdenar = document.getElementById('btn-ordenar');
        const btnFavoritos = document.getElementById('btn-favoritos');
        const btnEliminarVarios = document.getElementById('btn-eliminar-varios');
        const btnGuardar = document.getElementById('btn-guardar');

        function mostrarListado() {
            listaContactosEl.innerHTML = '';
            let textoBusqueda = inputBuscar.value.toLowerCase();

            let contactosFiltrados = contactos.filter(c => {
                let coincideTexto = c.nombre.toLowerCase().includes(textoBusqueda) ||
                                    c.apellido.toLowerCase().includes(textoBusqueda) ||
                                    c.telefono.includes(textoBusqueda);
                let coincideFavorito = soloFavoritos ? c.favorito : true;
                return coincideTexto && coincideFavorito;
            });

            contactosFiltrados.sort((a, b) => {
                let valorA = a[criterioOrden].toLowerCase();
                let valorB = b[criterioOrden].toLowerCase();
                return valorA.localeCompare(valorB);
            });

            if (contactosFiltrados.length === 0) {
                listaContactosEl.innerHTML = '<li class="list-group-item text-muted text-center">No se encontraron contactos</li>';
                return;
            }

            contactosFiltrados.forEach(c => {
                let li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <div class="d-flex align-items-center gap-2">
                        <input class="form-check-input seleccion-checkbox" type="checkbox" data-id="${c.id}">
                        <span><strong>${c.nombre} ${c.apellido}</strong> - ${c.telefono}</span>
                    </div>
                    <div class="btn-group btn-group-sm">
                        <button class="btn ${c.favorito ? 'btn-warning' : 'btn-outline-warning'}" onclick="toggleFavorito(${c.id})">⭐</button>
                        <button class="btn btn-outline-primary" onclick="cargarEdicion(${c.id})">Editar</button>
                        <button class="btn btn-outline-danger" onclick="eliminarContacto(${c.id})">Eliminar</button>
                    </div>
                `;
                listaContactosEl.appendChild(li);
            });
        }

        formEl.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (editandoId !== null) {
                contactos = contactos.map(c => {
                    if (c.id === editandoId) {
                        return { ...c, nombre: inputNombre.value, apellido: inputApellido.value, telefono: inputTelefono.value };
                    }
                    return c;
                });
                editandoId = null;
                btnGuardar.textContent = 'Agregar Contacto';
                btnGuardar.classList.replace('btn-success', 'btn-primary');
            } else {
                const nuevoContacto = {
                    id: Date.now(), 
                    nombre: inputNombre.value,
                    apellido: inputApellido.value,
                    telefono: inputTelefono.value,
                    favorito: false
                };
                contactos.push(nuevoContacto);
            }

            formEl.reset();
            mostrarListado();
        });

        function eliminarContacto(id) {
            contactos = contactos.filter(c => c.id !== id);
            mostrarListado();
        }

        function toggleFavorito(id) {
            contactos = contactos.map(c => {
                if (c.id === id) {
                    return { ...c, favorito: !c.favorito };
                }
                return c;
            });
            mostrarListado();
        }

        function cargarEdicion(id) {
            let contacto = contactos.find(c => c.id === id);
            if (contacto) {
                inputNombre.value = contacto.nombre;
                inputApellido.value = contacto.apellido;
                inputTelefono.value = contacto.telefono;
                editandoId = id;
                btnGuardar.textContent = 'Guardar Cambios';
                btnGuardar.classList.replace('btn-primary', 'btn-success');
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }
        }

        btnEliminarVarios.addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('.seleccion-checkbox:checked');
            const idsAEliminar = Array.from(checkboxes).map(ch => Number(ch.dataset.id));
            
            if (idsAEliminar.length === 0) {
                alert('Selecciona al menos un contacto para eliminar.');
                return;
            }

            if (confirm('¿Estás seguro de eliminar los contactos seleccionados?')) {
                contactos = contactos.filter(c => !idsAEliminar.includes(c.id));
                mostrarListado();
            }
        });

        btnOrdenar.addEventListener('click', () => {
            if (criterioOrden === 'nombre') {
                criterioOrden = 'apellido';
                btnOrdenar.textContent = 'Ordenar: Apellido';
            } else {
                criterioOrden = 'nombre';
                btnOrdenar.textContent = 'Ordenar: Nombre';
            }
            mostrarListado();
        });

        btnFavoritos.addEventListener('click', () => {
            soloFavoritos = !soloFavoritos;
            if (soloFavoritos) {
                btnFavoritos.textContent = 'Ver Favoritos (Activo)';
                btnFavoritos.classList.replace('btn-outline-warning', 'btn-warning');
            } else {
                btnFavoritos.textContent = 'Ver Todos';
                btnFavoritos.classList.replace('btn-warning', 'btn-outline-warning');
            }
            mostrarListado();
        });

        inputBuscar.addEventListener('input', () => {
            mostrarListado();
        });

        mostrarListado();
    </script>
</body>
</html>
