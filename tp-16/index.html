<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <header class="bg-danger text-white p-3">
    <div class="container d-flex justify-content-between">
      <a class="text-white fw-bold text-decoration-none" href="#">Pokédex</a>
      <span>Tu guía de Kanto</span>
    </div>
  </header>

  <main>
    <section class="bg-danger text-white py-5">
      <div class="container">
        <h1 class="display-4 fw-bold">¡Hazte con todos!</h1>
        <p class="lead">Explora y conoce a los Pokémon de Kanto.</p>
        <a class="btn btn-light text-danger" href="#pokedex">Ver Pokémon</a>
      </div>
    </section>

    <section class="container py-5" id="pokedex">
      <div class="d-flex flex-column flex-sm-row justify-content-between gap-3 mb-4">
        <h2 class="fw-bold">Pokédex <small class="fs-6 text-secondary">151 Pokémon</small></h2>
        <div class="col-sm-4">
          <input class="form-control" id="busqueda" type="search" placeholder="Buscar Pokémon..." aria-label="Buscar Pokémon">
        </div>
      </div>
      <p class="alert alert-danger d-none" id="error"></p>
      <p class="text-center text-secondary d-none" id="sin-resultados">No se encontraron Pokémon.</p>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-5 g-3" id="pokemones"></div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center p-3">
    Datos proporcionados por <a class="text-white" href="https://pokeapi.co/">PokeAPI</a>
  </footer>

  <div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5 text-capitalize" id="nombre-modal"></h2>
          <button class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-center">
          <div class="d-none" id="detalles">
            <img class="img-fluid bg-danger-subtle rounded mb-3" id="imagen-modal" width="180" height="180" alt="">
            <p id="numero-modal"></p>
            <div class="d-flex justify-content-center gap-2 mb-3" id="tipos-modal"></div>
            <div class="row text-start">
              <section class="col">
                <h3 class="h6">Habilidades</h3>
                <ul class="list-unstyled" id="habilidades-modal"></ul>
              </section>
              <section class="col">
                <h3 class="h6">Movimientos</h3>
                <ul class="list-unstyled" id="movimientos-modal"></ul>
              </section>
            </div>
          </div>
          <p class="alert alert-danger d-none" id="error-modal"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
